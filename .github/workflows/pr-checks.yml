name: PR checks

on:
  pull_request:

jobs:
  pr-checks:
    name: pr-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      # Empty when setup or install fails before the checks run.
      checks_outcome: ${{ steps.checks.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Needed to diff against the merge base.
          fetch-depth: 0

      # The version comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      # Keep the job running so the failure context can be captured.
      # The original exit code is used at the end.
      - name: Run quality checks
        id: checks
        continue-on-error: true
        env:
          CI: 'true'
        run: |
          set +e

          pnpm check > check-output.log 2>&1
          exit_code=$?

          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

          exit "$exit_code"

      - name: Print check output
        if: always()
        run: |
          if [ -f check-output.log ]; then
            cat check-output.log
          fi

      # Build the state sent to Jev. The full Actions log stays out of it.
      - name: Build failure state
        if: steps.checks.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
        run: |
          # Keep only the tail of the check output to limit the state sent to Jev.
          tail -c 16000 check-output.log | tail -n 200 > check-output.tail.log

          # Use the three-dot diff to compare the PR branch from its merge base.
          changed_files="$(
            git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"

          # Include the diff so Jev can compare the failure with the actual code changes.
          # Exclude the lockfile to keep the diff small.
          git diff --no-color --unified=3 "$BASE_SHA...$HEAD_SHA" \
            -- . ':(exclude)pnpm-lock.yaml' > change-diff.patch

          if [ "$(wc -c < change-diff.patch)" -gt 8000 ]; then
            head -c 8000 change-diff.patch > change-diff.trimmed.patch
            printf '\n[diff truncated at 8 KB]\n' >> change-diff.trimmed.patch
            mv change-diff.trimmed.patch change-diff.patch
          fi

          jq -n \
            --argjson exit_code "$EXIT_CODE" \
            --argjson changed_files "$changed_files" \
            --rawfile diff change-diff.patch \
            --rawfile logs check-output.tail.log \
            '{
              job: {
                name: "quality",
                command: "pnpm check",
                exit_code: $exit_code
              },
              change: {
                changed_files: $changed_files,
                diff: $diff
              },
              logs: $logs
            }' > failure-state.json

      - name: Upload failure state
        if: steps.checks.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: failure-state
          path: failure-state.json

      # Jev is diagnostic only. The original command decides pass or fail.
      - name: Fail with original exit code
        if: always() && steps.checks.outcome == 'failure'
        env:
          EXIT_CODE: ${{ steps.checks.outputs.exit_code }}
        run: exit "$EXIT_CODE"

  classify-failure:
    name: classify-failure
    needs: pr-checks
    # Only when the checks failed, not when setup or install did.
    if: always() && needs.pr-checks.outputs.checks_outcome == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: write # Required to post the PR comment

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The classifier has no runtime dependencies, so no install step is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download failure state
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: failure-state
          path: .

      # Skip fork PRs because repository secrets are not available to them.
      - name: Classify failure with Jev
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f failure-state.json ]; then
            echo "Jev classification skipped: no failure state was uploaded."
            exit 0
          fi

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Jev classification skipped: OPENROUTER_API_KEY is not configured."
            exit 0
          fi

          if node scripts/classify-ci-failure.ts failure-state.json > jev-result.json 2> jev-error.log; then
            cat jev-result.json

            {
              echo "### Jev failure classification"
              echo
              jq -r '
                "- **Category:** \(.failureCategory.value) " +
                "(confidence \(.failureCategory.confidence))",
                "- **Caused by this change:** \(.changeRelated.probability)",
                "- **Diagnostic clarity:** \(.diagnosticClarity.score) " +
                "(confidence \(.diagnosticClarity.confidence))"
              ' jev-result.json
              echo
              echo '<details><summary>Raw decision</summary>'
              echo
              echo '```json'
              cat jev-result.json
              echo '```'
              echo
              echo '</details>'
              echo
              jq -r '
                "`\(.response.model)` · \(.response.usage.input_tokens) input tokens · " +
                "$\(.response.usage.cost // 0) · a diagnosis, not a verdict"
              ' jev-result.json
            } > jev-comment.md
          else
            cat jev-error.log

            # Replace any previous classification with the error instead of leaving stale output.
            {
              echo "### Jev failure classification"
              echo
              echo "Classification failed:"
              echo
              echo '```'
              cat jev-error.log
              echo '```'
            } > jev-comment.md
          fi

          cat jev-comment.md >> "$GITHUB_STEP_SUMMARY"

          # Update the existing Jev comment instead of creating one on every run.
          gh pr comment "$PR_NUMBER" \
            --body-file jev-comment.md \
            --edit-last \
            --create-if-none \
            || echo "Could not post the classification comment."

      - name: Note skipped Jev classification
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### Jev failure classification"
            echo
            echo "Skipped because repository secrets are not exposed to pull requests from forks."
          } >> "$GITHUB_STEP_SUMMARY"
